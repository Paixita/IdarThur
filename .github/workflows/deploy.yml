name: Validate production build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Voice regression tests
        run: npm run test:voice && npm run test:news && npm run test:chat

      - name: Lint Check
        run: npm run lint
      
      - name: Build Project
        run: npm run build
      
      # Vercel publica main mediante su integración Git y reporta el resultado.
      # Esta automatización valida el mismo código sin duplicar el despliegue.

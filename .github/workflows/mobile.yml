name: Validate Android application
on:
  push:
    branches: [main]
    paths:
      - 'mobile/app/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile/app
      - run: flutter analyze
        working-directory: mobile/app
      - run: flutter test
        working-directory: mobile/app
